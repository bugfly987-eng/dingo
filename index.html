<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plum Landing: Feed the Dingo</title>
    
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/added.css">
    <link rel="stylesheet" href="./css/ecosystem_v2.css">

    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 988px; height: 556px; background-color: #222; }
        canvas { position: absolute; top: 0; left: 0; }
        #bg_canv { z-index: 10; }
        #anim_bg_canv { z-index: 20; }
        #terrarium_canv { z-index: 30; }
        #ui_canv { z-index: 40; }
        #splashimg { z-index: 50; position: absolute; }
        #playbtn { z-index: 60; position: absolute; cursor: pointer; }
    </style>

    <script>
        // CONFIGURATION: Relative paths for the /dingo/ subfolder
        var resourcePath = "./"; 
        var imagePath = "./i/";
        var audioPath = "./audio/";
        var assetPath = "./assets/";
        
        var world = 'desert';
        var gameType = 'desert';
    </script>

    <script src="./js/jquery-1.8.3.min.js"></script>
    <script src="./js/easeljs-0.7.0.min.js"></script>
    <script src="./js/preloadjs-0.4.1.min.js"></script>
    <script src="./js/soundjs-0.5.1.min.js"></script>
    <script src="./js/tweenjs-0.5.1.min.js"></script>
    <script src="./js/movieclip-0.6.1.min.js"></script>
    
    <script src="./js/Vect.js"></script>
    <script src="./js/Critter.js"></script>
    <script src="./js/MovingCritter.js"></script>
    <script src="./js/terrariumlib.js"></script>
</head>
<body>

    <div id="game-container">
        <canvas id="bg_canv" width="988" height="556"></canvas>
        <canvas id="anim_bg_canv" width="988" height="556"></canvas>
        <canvas id="terrarium_canv" width="988" height="556"></canvas>
        <canvas id="ui_canv" width="988" height="556"></canvas>
        
        <img id="splashimg" src="./i/terrarium-desert-splash.jpg" width="988" height="556">
        
        <div id="playbtn" onclick="startGame()" style="left: 405px; bottom: 50px;">
            <img src="./i/playbutton.png" alt="Play">
        </div>
    </div>

    <script>
        function startGame() {
            console.log("Start Button Clicked.");
            $('#splashimg').fadeOut(500);
            $('#playbtn').hide();

            if (typeof init === "function") {
                console.log("init() found! Launching game...");
                init(); 
            } else {
                console.error("Game engine failed to load. Check console for 404 errors.");
                alert("The game engine (terrariumlib.js) is still not being seen by the browser.");
            }
        }
    </script>
</body>
</html>
