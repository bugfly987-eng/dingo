<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Feed the Dingo</title>
    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 988px; height: 556px; background: #222; }
        canvas { position: absolute; top: 0; left: 0; }
        #status-msg { position: absolute; top: 10px; color: #555; font-family: sans-serif; font-size: 12px; width: 100%; text-align: center; z-index: 100; }
    </style>

    <script src="js/jquery-1.8.3.min.js"></script>
</head>
<body>
    <div id="status-msg">Loading Game Engine...</div>

    <div id="game-container">
        <canvas id="anim_bg_canv" width="988" height="556"></canvas>
        <canvas id="terrarium_canv" width="988" height="556"></canvas>
        <canvas id="bg_canv" width="988" height="556"></canvas>
        <canvas id="ui_canv" width="988" height="556"></canvas>
        
        <img id="splashimg" src="https://web.archive.org/web/20251021170710im_/https://pbskids.org/plumlanding/games/ecosystem/i/terrarium-desert-splash.jpg" width="988" height="556" style="position: absolute; z-index: 50;">
        
        <div id="playbtn" style="position: absolute; left: 405px; bottom: 50px; z-index: 60; cursor: pointer; display: none;">
            <img src="https://web.archive.org/web/20251021170710im_/https://pbskids.org/plumlanding/games/ecosystem/i/playbutton.png">
        </div>
    </div>

    <script>
        function loadScripts(scripts) {
            if (scripts.length === 0) {
                console.log("All scripts loaded!");
                $('#status-msg').text("Ready!");
                $('#playbtn').show();
                return;
            }
            let s = document.createElement('script');
            s.src = "js/" + scripts.shift();
            s.onload = () => loadScripts(scripts);
            s.onerror = () => $('#status-msg').text("Error loading: " + s.src);
            document.body.appendChild(s);
        }

        // The exact order the game needs
        const myScripts = [
            "easeljs-0.7.0.min.js",
            "preloadjs-0.4.1.min.js",
            "soundjs-0.5.1.min.js",
            "tweenjs-0.5.1.min.js",
            "movieclip-0.6.1.min.js",
            "terrariumlib.js"
        ];

        $(document).ready(() => loadScripts(myScripts));

        $('#playbtn').on('click', function() {
            $('#splashimg').hide();
            $(this).hide();
            $('#status-msg').hide();
            if (typeof init === "function") { init(); }
        });
    </script>
</body>
</html>
