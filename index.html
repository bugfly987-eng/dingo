<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plum Landing: Feed the Dingo</title>
    
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/added.css">
    <link rel="stylesheet" href="css/ecosystem_v2.css">

    <style>
        body { 
            margin: 0; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif;
        }
        #game-container { 
            position: relative; 
            width: 988px; 
            height: 556px; 
            background-color: #222;
        }
        /* Proper Layering: Bottom to Top */
        canvas { position: absolute; top: 0; left: 0; }
        #bg_canv { z-index: 10; }          /* Static Background */
        #anim_bg_canv { z-index: 20; }     /* Animated elements like clouds */
        #terrarium_canv { z-index: 30; }   /* The actual Animals/Plants */
        #ui_canv { z-index: 40; }         /* Buttons and Menus */
        
        #splashimg { z-index: 50; position: absolute; }
        #playbtn { z-index: 60; position: absolute; cursor: pointer; }
    </style>

    <script>
        // CONFIGURATION: Tells terrariumlib.js where to look
        var resourcePath = "./"; 
        var imagePath = "i/";
        var audioPath = "audio/";
        var assetPath = "assets/";
        
        // GAME STATE
        var world = 'desert';
        var gameType = 'desert';

        // ERROR TRACKING
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'IMG' || e.target.tagName === 'SCRIPT') {
                console.error("FILE FAILED TO LOAD: " + e.target.src);
            }
        }, true);
    </script>

    <script src="js/jquery-1.8.3.min.js"></script>
    <script src="js/easeljs-0.7.0.min.js"></script>
    <script src="js/preloadjs-0.4.1.min.js"></script>
    <script src="js/soundjs-0.5.1.min.js"></script>
    <script src="js/tweenjs-0.5.1.min.js"></script>
    <script src="js/movieclip-0.6.1.min.js"></script>
    
    <script src="js/Vect.js"></script>
    <script src="js/Critter.js"></script>
    <script src="js/MovingCritter.js"></script>
    <script src="js/terrariumlib.js"></script>
</head>
<body>

    <div id="game-container">
        <canvas id="bg_canv" width="988" height="556"></canvas>
        <canvas id="anim_bg_canv" width="988" height="556"></canvas>
        <canvas id="terrarium_canv" width="988" height="556"></canvas>
        <canvas id="ui_canv" width="988" height="556"></canvas>
        
        <script src="./js/terrariumlib.js"></script>
        
        <div id="playbtn" onclick="startGame()" style="left: 405px; bottom: 50px;">
            <img src="i/playbutton.png" alt="Play">
        </div>
    </div>

    <script>
        function startGame() {
            console.log("System: Start Button Clicked.");
            
            // Hide the splash screen
            $('#splashimg').fadeOut(500);
            $('#playbtn').hide();

            // Check if the game engine loaded
            if (typeof init === "function") {
                console.log("System: init() found. Starting Game Engine...");
                try {
                    init(); 
                } catch (err) {
                    console.error("System: Game crashed during init(): ", err);
                }
            } else {
                console.error("System: 'init' function missing! Check if terrariumlib.js is in the 'js' folder.");
                alert("The game engine (terrariumlib.js) failed to load. Check your 'js' folder.");
            }
        }
    </script>
</body>
</html>
