<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Feed the Dingo - Local</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/added.css">
    <link rel="stylesheet" href="css/ecosystem_v2.css">

    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 988px; height: 556px; }
        canvas { position: absolute; top: 0; left: 0; }
    </style>

    <script src="js/jquery-1.8.3.min.js"></script>
    <script src="js/easeljs-0.7.0.min.js"></script>
    <script src="js/preloadjs-0.4.1.min.js"></script>
    <script src="js/soundjs-0.5.1.min.js"></script>
    <script src="js/tweenjs-0.5.1.min.js"></script>
    <script src="js/movieclip-0.6.1.min.js"></script>
    <script src="js/terrariumlib.js"></script>
    <script src="js/MovingCritter.js"></script>
    <script src="js/Critter.js"></script>
    <script src="js/Vect.js"></script>

    <script>
        var world = 'desert';
        var gameType = 'desert';
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="anim_bg_canv" width="988" height="556"></canvas>
        <canvas id="terrarium_canv" width="988" height="556"></canvas>
        <canvas id="bg_canv" width="988" height="556"></canvas>
        <canvas id="ui_canv" width="988" height="556"></canvas>
        
        <img id="splashimg" src="i/terrarium-desert-splash.jpg" width="988" height="556" style="position: absolute; z-index: 50;">
        
        <div id="playbtn" onclick="startGame()" style="position: absolute; left: 405px; bottom: 50px; z-index: 60; cursor: pointer;">
            <img src="i/playbutton.png">
        </div>
    </div>

    <script>
        function startGame() {
            $('#splashimg, #playbtn').hide();
            if (typeof init === "function") { init(); }
        }
    </script>
</body>
</html>
