<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plum Landing: Feed the Dingo</title>
    
    <link rel="stylesheet" href="/dingo/css/reset.css">
    <link rel="stylesheet" href="/dingo/css/style.css">
    <link rel="stylesheet" href="/dingo/css/added.css">
    <link rel="stylesheet" href="/dingo/css/ecosystem_v2.css">

    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 988px; height: 556px; background-color: #222; }
        canvas { position: absolute; top: 0; left: 0; }
        #bg_canv { z-index: 10; }
        #terrarium_canv { z-index: 30; }
        #ui_canv { z-index: 40; }
        #splashimg { z-index: 50; position: absolute; }
        #playbtn { z-index: 60; position: absolute; cursor: pointer; }
    </style>

    <script>
        // Paths updated to include /dingo/
        var resourcePath = "/dingo/"; 
        var imagePath = "/dingo/i/";
        var audioPath = "/dingo/audio/";
        var assetPath = "/dingo/assets/";
        
        var world = 'desert';
        var gameType = 'desert';
    </script>

    <script src="/dingo/js/jquery-1.8.3.min.js"></script>
    <script src="/dingo/js/easeljs-0.7.0.min.js"></script>
    <script src="/dingo/js/preloadjs-0.4.1.min.js"></script>
    <script src="/dingo/js/soundjs-0.5.1.min.js"></script>
    <script src="/dingo/js/tweenjs-0.5.1.min.js"></script>
    <script src="/dingo/js/movieclip-0.6.1.min.js"></script>
    
    <script src="/dingo/js/Vect.js"></script>
    <script src="/dingo/js/Critter.js"></script>
    <script src="/dingo/js/MovingCritter.js"></script>
    <script src="/dingo/js/terrariumlib.js"></script>
</head>
<body>

    <div id="game-container">
        <canvas id="bg_canv" width="988" height="556"></canvas>
        <canvas id="anim_bg_canv" width="988" height="556"></canvas>
        <canvas id="terrarium_canv" width="988" height="556"></canvas>
        <canvas id="ui_canv" width="988" height="556"></canvas>
        
        <img id="splashimg" src="/dingo/i/terrarium-desert-splash.jpg" width="988" height="556">
        
        <div id="playbtn" onclick="startGame()" style="left: 405px; bottom: 50px;">
            <img src="/dingo/i/playbutton.png" alt="Play">
        </div>
    </div>

    <script>
        function startGame() {
            console.log("System: Testing for init function...");
            
            if (typeof init === "function") {
                console.log("System: Engine Loaded! Starting...");
                $('#splashimg').fadeOut(500);
                $('#playbtn').hide();
                init(); 
            } else {
                console.error("System: Engine NOT FOUND at /dingo/js/terrariumlib.js");
                alert("The browser still can't find the game files. Check the Network tab in F12 for red lines.");
            }
        }
    </script>
</body>
</html>
