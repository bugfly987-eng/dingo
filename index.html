    <script>
        function startGame() {
            console.log("System: Testing for init function...");
            
            if (typeof init === "function") {
                console.log("System: Engine Loaded! Starting...");
                $('#splashimg').fadeOut(500);
                $('#playbtn').hide();
                init(); 
            } else {
                console.error("System: Engine NOT FOUND at /dingo/js/terrariumlib.js");
                alert("The browser still can't find the game files. Check the Network tab in F12 for red lines.");
            }
        }
    </script>
