<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Feed the Dingo</title>
    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { position: relative; width: 988px; height: 556px; background: #333; border: 2px solid #555; }
        canvas { position: absolute; top: 0; left: 0; }
    </style>

    <script src="js/jquery-1.8.3.min.js"></script>
    <script src="js/easeljs-0.7.0.min.js"></script>
    <script src="js/preloadjs-0.4.1.min.js"></script>
    <script src="js/soundjs-0.5.1.min.js"></script>
    <script src="js/tweenjs-0.5.1.min.js"></script>
    <script src="js/movieclip-0.6.1.min.js"></script>
    <script src="js/terrariumlib.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="anim_bg_canv" width="988" height="556"></canvas>
        <canvas id="terrarium_canv" width="988" height="556"></canvas>
        <canvas id="bg_canv" width="988" height="556"></canvas>
        <canvas id="ui_canv" width="988" height="556"></canvas>
        
        <img id="splashimg" src="https://web.archive.org/web/20251021170710im_/https://pbskids.org/plumlanding/games/ecosystem/i/terrarium-desert-splash.jpg" width="988" height="556" style="position: absolute; z-index: 50;">
        
        <div id="playbtn" onclick="startGame()" style="position: absolute; left: 405px; bottom: 50px; z-index: 60; cursor: pointer;">
            <img src="https://web.archive.org/web/20251021170710im_/https://pbskids.org/plumlanding/games/ecosystem/i/playbutton.png">
        </div>
    </div>

    <script type="text/javascript">
        function startGame() {
            console.log("Attempting to start game...");
            document.getElementById('splashimg').style.display = 'none';
            document.getElementById('playbtn').style.display = 'none';
            
            // This tries every known way the game might want to start
            if (typeof init === "function") { init(); }
            else if (typeof App !== "undefined" && App.init) { App.init(); }
            else { alert("The game code (js files) didn't load correctly. Check your 'js' folder names!"); }
        }
    </script>
</body>
</html>
